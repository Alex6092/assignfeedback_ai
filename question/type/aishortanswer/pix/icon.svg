<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Champ de saisie une ligne -->
  <rect x="12" y="34" width="62" height="26" rx="6" fill="#6c63ff" opacity="0.15"/>
  <rect x="12" y="34" width="62" height="26" rx="6" fill="none" stroke="#6c63ff" stroke-width="4"/>
  <!-- Texte saisi (ligne courte) + curseur -->
  <line x1="22" y1="47" x2="48" y2="47" stroke="#6c63ff" stroke-width="4" stroke-linecap="round"/>
  <line x1="56" y1="41" x2="56" y2="53" stroke="#6c63ff" stroke-width="3" stroke-linecap="round"/>
  <!-- Pastille IA -->
  <circle cx="74" cy="70" r="20" fill="#6c63ff"/>
  <text x="74" y="77" font-size="22" font-weight="bold" text-anchor="middle"
        font-family="sans-serif" fill="#ffffff">AI</text>
</svg>
