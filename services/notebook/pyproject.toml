[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "moodle-notebook"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "docker>=7,<8", "nbformat>=5.10,<6", "nbgrader>=0.9.5,<0.10"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "jupyterhub==5.5.5", "dockerspawner==14.0.0"]

[tool.setuptools.packages.find]
include = ["notebook_service*"]
